name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDK_IMAGE: ghcr.io/blitterstudio/aar-sdk

jobs:
  lint:
    name: lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: actionlint (workflow files)
        run: docker run --rm -v "$PWD":/repo:ro -w /repo rhysd/actionlint:latest -color

  # Builds the SDK image (Arm GNU Toolchain 15.3.rel2 and a PIC newlib for both
  # profiles, pinned by version and sha256 in docker/Dockerfile) and runs
  # everything that needs it inside the image: make check for A32 and A64, the
  # CMake examples, and the qemu runtime test.
  sdk-image:
    name: SDK image, make check, CMake examples, runtime test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build SDK image
        run: docker build -f docker/Dockerfile -t aar-sdk:ci .
      - name: make check (both profiles)
        run: docker run --rm aar-sdk:ci make check
      - name: CMake examples (A32 and A64, with newlib)
        run: |
          docker run --rm aar-sdk:ci bash -c '
            set -euo pipefail
            for profile in a32 a64; do
              cmake -S "$AAR_SDK/cmake/example" -B "/tmp/example-$profile" \
                -DCMAKE_TOOLCHAIN_FILE="$AAR_SDK/cmake/aar-toolchain-$profile.cmake"
              cmake --build "/tmp/example-$profile"
            done
          '
      - name: CMake examples (A32 and A64, freestanding, without the PIC sysroot)
        run: |
          docker run --rm aar-sdk:ci bash -c '
            set -euo pipefail
            unset AAR_SYSROOT_A32 AAR_SYSROOT_A64
            for profile in a32 a64; do
              cmake -S "$AAR_SDK/cmake/example" -B "/tmp/freestanding-$profile" \
                -DCMAKE_TOOLCHAIN_FILE="$AAR_SDK/cmake/aar-toolchain-$profile.cmake" \
                -DAAR_FREESTANDING=ON
              cmake --build "/tmp/freestanding-$profile"
            done
          '
      # libaar on a real instruction stream under qemu user mode. The apps
      # need the bare-metal toolchain and sysroot of the image; the loader
      # needs the Linux cross compilers and their libc, and qemu runs both.
      - name: make check-runtime (qemu user mode)
        run: |
          docker run --rm aar-sdk:ci bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              qemu-user gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
              gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            make check-runtime
          '

  # Header layout and the transport model with the host compiler, 64-bit and
  # -m32, plus a C++ syntax check of every header.
  abi-host:
    name: header ABI on the host (64-bit and -m32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install a multilib compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc gcc-multilib g++ g++-multilib binutils
      - name: Layout and transport model tests
        run: tests/abi_check.sh host
      - name: Host AAR_NOTE expands to nothing
        run: |
          set -euo pipefail
          cat > /tmp/aar-note-host.c <<'EOF'
          #include "aar/note.h"
          AAR_NOTE(0, 0, 1, 0)
          int host_ok(void) { return 0; }
          EOF
          gcc -Wall -Wextra -Werror -std=c11 -I include -c -o /tmp/aar-note-host.o /tmp/aar-note-host.c
          if readelf -S /tmp/aar-note-host.o | grep -q note.aar; then
            echo "host AAR_NOTE emitted a note" >&2
            exit 1
          fi

  # aar.library, the Amiga client library: the generated call headers are
  # current, the structure layouts match the 68k rules, the image probe agrees
  # with tools/aar-check on a corpus and its mutations, the library core runs
  # against a reference platform and the AmigaOS shell on a fake system (both
  # also under the address and undefined-behaviour sanitizers), those tests fail
  # on deliberately broken code (client/tests/mutants.py), and the client API
  # document names every public symbol. The serving loop of aar_serve and the
  # launcher aar-run (client/serve, client/run) have their host tests here too:
  # the request handlers on a fake volume, console, display and audio, and the
  # decisions of the loop and of the launcher. 64-bit and -m32. The scripts that
  # run these tests are themselves tested to stop on a failing program.
  client-host:
    name: client library host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install a multilib compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc gcc-multilib g++ python3
      - name: Generator check, layouts, probe, core, shell, serve and run tests, mutants, API documents
        run: sh client/tests/run_host.sh
      - name: The test scripts stop when a program they run fails
        run: sh client/tests/scripts_test.sh

  # The reference loader (loader/, MIT, the code another platform takes to load
  # an app image): plan and place on images built in memory (relocations of A32
  # REL and RELA and of A64 RELA, the bss, a write base unlike the run address,
  # the memory limit, damaged plans and images), the C-ELF corpus of the
  # conformance suite for both profiles against its MANIFEST, the corpus of
  # tests/aar_check_test.py and its mutations against tools/aar-check, and a
  # bounded mutation fuzz run. 64-bit, -m32 and with the address and undefined
  # behaviour sanitizers. The loader also loads every image of make check-runtime
  # (sdk-image job), under qemu, for both profiles; client-m68k compiles it for
  # the 68k (the probe of aar.library is built on the same image rules).
  loader-host:
    name: reference loader host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install a multilib compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc gcc-multilib python3
      - name: Loader tests (64-bit, -m32, sanitizers)
        run: sh loader/tests/run_host.sh

  # The client headers, the library sources (core, probe, shell, reference
  # platform), the serving loop and the launcher with the cross compiler that
  # builds zz9k.library (the image the firmware SDK pins by digest), compile
  # only: no warning, no function above 1 KiB of stack (4 KiB in the serving
  # code), every vector called through the library base. aar-run is linked.
  client-m68k:
    name: client headers for AmigaOS m68k
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Compile with m68k-amigaos-gcc
        run: |
          docker run --rm -v "$PWD":/src:ro \
            amigadev/crosstools@sha256:9c81fcd973058fb37f1ca5b1c608c65473dc1dd657ab5c8533e7b43b80f01cf3 \
            sh -c 'cp -r /src /w && cd /w && sh client/tests/m68k_check.sh'

  # The conformance suite (conformance/): the payloads build for A32 and, where
  # the compiler is in the image, A64, and pass aar-check; the runner aar-conf
  # builds for m68k with the pinned cross compiler (it is part of
  # client/tests/m68k_check.sh); and the catalogue TESTS.md agrees with the ids
  # the payloads and the runner can print, with the runner's generated header
  # current. The payloads run under qemu in the sdk-image job (make
  # check-runtime) and on the host in the host job (ctest).
  conformance:
    name: conformance suite builds and catalogue check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build SDK image
        run: docker build -f docker/Dockerfile -t aar-sdk:conf .
      - name: Payloads for every profile, catalogue against the sources
        run: docker run --rm aar-sdk:conf make check-conf-payloads check-conf-catalogue
      - name: Catalogue counts
        run: python3 conformance/tools/conf_catalogue.py summary
      - name: Build the runner for m68k
        run: |
          docker run --rm -v "$PWD":/src:ro \
            amigadev/crosstools@sha256:9c81fcd973058fb37f1ca5b1c608c65473dc1dd657ab5c8533e7b43b80f01cf3 \
            sh -c 'cp -r /src /w && cd /w && sh client/tests/m68k_check.sh'

  # The conformance bundle a platform developer downloads (docs/porting.md): the
  # m68k runner aar-conf, the payloads of both profiles (each checked by
  # aar-check), the C-ELF corpus, and MANIFEST.txt with the suite version, the
  # source commit, the run commands and the sha256 of every file. The payloads
  # come from the SDK image (make conf-bundle), the runner from the pinned m68k
  # image, the manifest from the tree they make together. The artifact is
  # aar-conformance-bundle.
  conf-bundle:
    name: conformance bundle artifact
    runs-on: ubuntu-latest
    env:
      BUNDLE: /tmp/aar-conformance-bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build SDK image
        run: docker build -f docker/Dockerfile -t aar-sdk:bundle .
      - name: Payloads for A32 and A64, and the corpus
        run: |
          mkdir -p "$BUNDLE"
          docker run --rm -v "$BUNDLE":/out aar-sdk:bundle make conf-bundle BUNDLE=/out
      - name: Runner for m68k
        run: |
          docker run --rm -v "$PWD":/src:ro -v "$BUNDLE":/out \
            amigadev/crosstools@sha256:9c81fcd973058fb37f1ca5b1c608c65473dc1dd657ab5c8533e7b43b80f01cf3 \
            sh -c 'cp -r /src /w && cd /w && AAR_CONF_OUT=/out/aar-conf sh client/tests/m68k_check.sh'
      - name: Manifest
        run: python3 conformance/tools/conf_bundle.py manifest "$BUNDLE" --commit "$GITHUB_SHA"
      - name: List the bundle and check its hashes
        run: |
          cd "$BUNDLE"
          find . -type f | sort
          cat MANIFEST.txt
          grep -E '^[0-9a-f]{64}  ' MANIFEST.txt | sha256sum -c --quiet
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: aar-conformance-bundle
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

  docs:
    name: AAR API docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: API reference covers every public symbol
        run: python3 docs/check_aar_api.py --self-test

  host:
    name: SDL2 host runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Mesa (llvmpipe) gives the GL tests a context without a GPU: EGL for the
      # headless runs, GLX under Xvfb for the window run.
      - name: Install SDL2, Mesa and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake python3 libsdl2-dev libegl1 libegl-mesa0 libgl1 \
            libgl1-mesa-dri libglx-mesa0 xvfb xauth
      - name: Configure
        run: cmake -S host-runner -B build-aar-host -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-aar-host --parallel
      # AAR_TEST_REQUIRE_GL turns a skipped GL test into a failure, so a
      # missing Mesa package cannot hide the GL group.
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          AAR_TEST_REQUIRE_GL: "1"
        run: ctest --test-dir build-aar-host --output-on-failure

  # Pushes ghcr.io/blitterstudio/aar-sdk on a v* tag and on a manual run only,
  # after every check passed. It is the only job that can write packages.
  # Tags: sha-<12 characters of the commit>, the tag name on a tag, and manual
  # on a workflow_dispatch run.
  publish:
    name: Publish the SDK image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, sdk-image, abi-host, client-host, loader-host, client-m68k, conformance, conf-bundle, docs, host]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build SDK image
        run: docker build -f docker/Dockerfile -t aar-sdk:publish .
      - name: Smoke test the image to publish
        run: docker run --rm aar-sdk:publish make check
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Tag and push
        run: |
          set -euo pipefail
          tags=("sha-${GITHUB_SHA::12}")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags+=("$GITHUB_REF_NAME")
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tags+=(manual)
          fi
          for tag in "${tags[@]}"; do
            docker tag aar-sdk:publish "$SDK_IMAGE:$tag"
            docker push "$SDK_IMAGE:$tag"
          done
